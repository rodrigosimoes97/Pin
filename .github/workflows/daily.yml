name: Daily Health Content Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Gemini connectivity
        run: |
          echo "Testing DNS..."
          getent hosts generativelanguage.googleapis.com

          echo "Testing HTTPS..."
          curl -I --connect-timeout 10 --max-time 20 \
            https://generativelanguage.googleapis.com

      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
        run: |
          # Testa conectividade apenas — 429/503 não interrompem o pipeline
          MODEL_NAME="${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}"
          curl -s --connect-timeout 10 --max-time 30 \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"OK"}]}],"generationConfig":{"maxOutputTokens":5}}' \
            -o /dev/null -w "Gemini connectivity check HTTP status: %{http_code}\n" || true


      - name: Run pipeline
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_ENABLE_PUBLISH: ${{ secrets.PINTEREST_ENABLE_PUBLISH }}
          POSTS_PER_WEEK: "5"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          TRANSFORMERS_VERBOSITY: "error"
          GOOGLE_INDEXING_JSON_PATH: ${{ secrets.GOOGLE_INDEXING_JSON_PATH }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python -m src.app.run_daily

      - name: Validate internal links
        run: python -m src.app.validate_links

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs generated
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: run daily health content engine"
          git push

      - name: Ping search engines (best effort)
        if: always()
        run: |
          SITEMAP_URL="https://health-ptg.pages.dev/sitemap.xml"
          curl -fsS "https://www.google.com/ping?sitemap=${SITEMAP_URL}" || true
          if [ -n "${INDEXNOW_KEY:-}" ]; then
            curl -fsS "https://api.indexnow.org/IndexNow?urlset=${SITEMAP_URL}&key=${INDEXNOW_KEY}" || true
          fi
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
