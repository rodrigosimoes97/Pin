[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pin-daily-health-system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "Pillow>=10.4.0",
    "sentence-transformers",
    "beautifulsoup4",
    "scikit-learn",
    "numpy",
    "pytrends",
    "google-auth",
    "google-api-python-client",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
